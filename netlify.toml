# Online version: public/index.html + netlify/functions/passes.mjs (see README "Online version").
# The own-wallet functions have real npm dependencies (node-forge, jszip, jsonwebtoken,
# @netlify/blobs), so an explicit install step is required — without it esbuild can't find them
# in node_modules when bundling the functions.
[build]
  command = "npm install"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Netlify's dependency tracer was leaving node-forge/jszip/jsonwebtoken out of the deployed bundle
  # (confirmed: the deployed function was ~350KB, the same as one with no dependencies at all, versus
  # 1.12MB when esbuild bundles them locally). Force-including all installed packages sidesteps
  # whatever the tracer was getting wrong, at the cost of a slightly larger function.
  included_files = ["node_modules/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
